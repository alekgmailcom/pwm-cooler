name: "PWM cooling Control"
version: "1.0.1"
slug: "pwm_cool"
description: "Управление многоканальным ШИМ через GPIO на Waveshare шилде"
arch:
  - armv7
  - aarch64
startup: "system"
boot: "auto"
host_network: true
privileged:
  - SYS_RAWIO
  - SYS_ADMIN
devices:
  - /dev/mem
  - /dev/gpiomem
  - /sys/class/gpio
options: {}
schema: {}
map:
  - config:rw
stdin: true
